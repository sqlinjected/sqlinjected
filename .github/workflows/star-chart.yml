name: Star Chart

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: write

concurrency:
  group: public-star-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find all public repositories
        id: repos
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          repos=$(gh api --paginate \
            "users/$OWNER/repos?type=all&per_page=100" \
            --jq '.[] | select(.private == false) | .full_name' \
            | sort -u \
            | paste -sd, -)

          if [ -z "$repos" ]; then
            echo "No public repositories found"
            exit 1
          fi

          echo "Repositories: $repos"
          echo "list=$repos" >> "$GITHUB_OUTPUT"

      - name: Draw combined star chart
        uses: leereilly/star-chart@e7fa78bdf8f78da6c3feeb3a97b528fd97d62727
        with:
          repositories: ${{ steps.repos.outputs.list }}
          output: assets/stars.svg
          style: sparkline
          title: Public repo stars
          theme: auto
          width: '420'
          show_change: 'false'
          logo: 'false'

      - name: Save updated chart
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/stars.svg

          if ! git diff --cached --quiet; then
            git commit -m "chore: update public repository star chart"
            git push
          else
            echo "Star chart already up to date"
          fi
